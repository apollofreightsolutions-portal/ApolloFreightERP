steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=dir://.'
      - '--destination=us-central1-docker.pkg.dev/$PROJECT_ID/apollo-freighterp/apollo-freighterp:$BUILD_ID'
      - '--cache=true'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'apollo-freighterp'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apollo-freighterp/apollo-freighterp:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--update-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=us-central1,GCS_BUCKET=apollo-freight-private-cs-project-xui8rpt4,GCS_PREFIX=apollo-freight,ALLOWED_ORIGIN=https://connected.apollo-freight.com'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
